<svg xmlns="http://www.w3.org/2000/svg" width="300" height="460" viewBox="0 0 300 460">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E1117"/><stop offset=".3" stop-color="#232838"/><stop offset=".55" stop-color="#1E1F26"/><stop offset="1" stop-color="#0E1117"/></linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1F26"/><stop offset=".45" stop-color="#2D5A58" stop-opacity=".8"/><stop offset="1" stop-color="#5EF2D6" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EF2D6" stop-opacity=".9"/><stop offset=".12" stop-color="#5EF2D6" stop-opacity="0"/><stop offset=".88" stop-color="#F0B45E" stop-opacity="0"/><stop offset="1" stop-color="#F0B45E" stop-opacity=".6"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9AE"/><stop offset=".5" stop-color="#B78B3E"/><stop offset="1" stop-color="#4A3212"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- smoky lower coat -->
  <path d="M86 230 C70 300 60 360 78 420 C96 400 104 440 122 410 C136 450 150 400 164 436 C176 400 196 430 206 396 C222 420 236 380 228 340 C222 290 214 250 210 230 Z" fill="url(#smoke)"/>
  <path d="M206 250 C240 300 270 330 286 300 C270 330 236 340 214 300" fill="#2D5A58" opacity=".55"/>
  <path d="M92 250 C62 300 30 320 18 296 C34 330 70 330 88 296" fill="#2D5A58" opacity=".5"/>
  <!-- torso -->
  <path d="M104 70 C86 74 76 92 74 120 L70 260 C100 276 200 276 226 260 L222 120 C220 92 212 74 196 70 L172 64 H128 Z" fill="url(#coat)" stroke="#05070A" stroke-width="3"/>
  <path d="M104 70 C86 74 76 92 74 120 L70 260 C100 276 200 276 226 260 L222 120 C220 92 212 74 196 70 L172 64 H128 Z" fill="url(#rim)"/>
  <!-- shirt + tie -->
  <path d="M128 64 L150 120 L172 64 Z" fill="#C7FFF1" opacity=".9"/>
  <path d="M143 74 h14 l-3 10 4 40 -8 10 -8 -10 4 -40 z" fill="#5E4B7A" stroke="#2A2238" stroke-width="1.5"/>
  <!-- lapels -->
  <path d="M128 64 L112 72 L104 112 L140 150 Z" fill="#141B2D" stroke="#05070A" stroke-width="2"/>
  <path d="M172 64 L188 72 L196 112 L160 150 Z" fill="#141B2D" stroke="#05070A" stroke-width="2"/>
  <path d="M112 74 L106 110 M188 74 L194 110" stroke="#B78B3E" stroke-width="2"/>
  <!-- brass buttons -->
  <g fill="url(#brass)" stroke="#3D2A0E" stroke-width="1.5">
    <circle cx="128" cy="168" r="6"/><circle cx="172" cy="168" r="6"/>
    <circle cx="128" cy="198" r="6"/><circle cx="172" cy="198" r="6"/>
    <circle cx="128" cy="228" r="6"/><circle cx="172" cy="228" r="6"/>
  </g>
  <!-- belt -->
  <rect x="72" y="244" width="154" height="14" fill="#0E1117"/>
  <rect x="140" y="242" width="20" height="18" rx="2" fill="none" stroke="url(#brass)" stroke-width="3"/>
  <!-- pocket watch chain + watch -->
  <path d="M176 180 C190 200 196 214 190 230" stroke="#D7B15A" stroke-width="2.5" fill="none" stroke-dasharray="4 2"/>
  <circle cx="190" cy="236" r="11" fill="url(#brass)" stroke="#3D2A0E" stroke-width="2"/>
  <circle cx="190" cy="236" r="7" fill="#FFF6D6"/>
  <path d="M190 236 v-6" stroke="#5EF2D6" stroke-width="2" filter="url(#glow)"/>
  <!-- epaulettes -->
  <path d="M84 84 C92 70 114 68 120 72 L114 92 C102 90 92 92 84 96 Z" fill="url(#brass)" stroke="#3D2A0E" stroke-width="2"/>
  <path d="M216 84 C208 70 186 68 180 72 L186 92 C198 90 208 92 216 96 Z" fill="url(#brass)" stroke="#3D2A0E" stroke-width="2"/>
  <!-- collar -->
  <path d="M124 56 h52 l-4 14 h-44 z" fill="#141B2D" stroke="#05070A" stroke-width="2"/>
</svg>
