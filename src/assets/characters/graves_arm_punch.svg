<svg xmlns="http://www.w3.org/2000/svg" width="140" height="260" viewBox="0 0 140 260">
  <!-- pivot (shoulder) at 40,20. Arm hangs down-forward, hand holds the oversized ticket punch -->
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E1117"/><stop offset=".5" stop-color="#252B3B"/><stop offset="1" stop-color="#0E1117"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEBB2"/><stop offset=".45" stop-color="#D7B15A"/><stop offset="1" stop-color="#4A3212"/></linearGradient>
    <radialGradient id="glove" r=".6"><stop offset="0" stop-color="#E9FFF9"/><stop offset="1" stop-color="#5EF2D6"/></radialGradient>
    <radialGradient id="aura" r=".5"><stop offset=".3" stop-color="#5EF2D6" stop-opacity=".55"/><stop offset="1" stop-color="#5EF2D6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M26 14 C50 6 60 20 58 40 L62 120 C62 130 40 134 34 124 L22 40 Z" fill="url(#sleeve)" stroke="#05070A" stroke-width="3"/>
  <path d="M30 116 h32 l2 14 h-36 z" fill="url(#brass)"/>
  <circle cx="70" cy="196" r="62" fill="url(#aura)"/>
  <!-- punch -->
  <g transform="translate(46 128) rotate(-8)">
    <path d="M6 30 L2 110 c0 8 18 8 18 0 L24 34 Z" fill="#2A2238" stroke="#05070A" stroke-width="2.5"/>
    <path d="M52 30 L66 104 c2 8 20 4 18 -4 L66 28 Z" fill="#2A2238" stroke="#05070A" stroke-width="2.5"/>
    <path d="M0 10 C0 -14 20 -24 38 -24 C56 -24 76 -14 76 10 L72 40 H4 Z" fill="url(#brass)" stroke="#3D2A0E" stroke-width="3"/>
    <rect x="16" y="-4" width="44" height="16" rx="3" fill="#141B2D"/>
    <circle cx="28" cy="4" r="5" fill="#5EF2D6" filter="url(#glow)"/>
    <path d="M42 -1 l7 5 -7 5 z" fill="#5EF2D6" filter="url(#glow)"/>
    <circle cx="38" cy="30" r="7" fill="#B78B3E" stroke="#3D2A0E" stroke-width="2"/>
  </g>
  <!-- glove -->
  <ellipse cx="50" cy="140" rx="18" ry="15" fill="url(#glove)" stroke="#2E5A5A" stroke-width="2" filter="url(#glow)"/>
</svg>
